<!DOCTYPE html>
<html>
<head>
<title>Contact Me - Daleen</title>
<style>
body { background-color: #eef4ff; font-family: Arial; text-align: center; }
h1 { color: #1a4fa0; }
a { color: #1a4fa0; margin: 10px; font-weight: bold; text-decoration: none; }
input, select, textarea { width: 250px; padding: 8px; margin: 5px; border: 1px solid #1a4fa0; border-radius: 5px; }
button { background-color: #1a4fa0; color: white; padding: 10px 20px; border: none; border-radius: 5px; }
</style>
<script>
function validateForm() {
  var name = document.getElementById("name").value;
  var email = document.getElementById("email").value;
  var country = document.getElementById("country").value;
  var comments = document.getElementById("comments").value;
  if (name == "" || email == "" || country == "" || comments == "") {
    alert("Please fill all fields");
    return false;
  }
  alert("Thank you " + name + "! Your message has been sent.");
  return true;
}
</script>
</head>
<body>
<a href="index.html">Home</a>
<a href="contact.html">Contact Me</a>
<h1>Contact Me</h1>
<p>Feel free to contact me!</p>
<form onsubmit="return validateForm()">
<p>Full Name:<br><input type="text" id="name"></p>
<p>Email Address:<br><input type="email" id="email"></p>
<p>Country:<br><select id="country"><option value="">Select Country</option><option>Jordan</option><option>Palestine</option><option>Syria</option><option>Saudi Arabia</option><option>UAE</option><option>Other</option></select></p>
<p>Comments:<br><textarea id="comments" rows="4"></textarea></p>
<p><button type="submit">Submit</button></p>
</form>
<p>My Email: dshailat23@cit.just.edu.jo</p>
</body>
</html>
